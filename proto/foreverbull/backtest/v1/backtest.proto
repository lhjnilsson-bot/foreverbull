syntax = "proto3";

package foreverbull.backtest.v1;

import "foreverbull/common.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/backtest";

message Backtest {
  message Period {
    message Asset {
      string symbol = 1;
      bool enabled = 2;
    }
    foreverbull.common.Date start_date = 1;
    foreverbull.common.Date end_date = 2;

    repeated Asset assets = 3;
  }
  string name = 1;
  string benchmark = 5;

  repeated Period periods = 6;

  // yahoo, stooq, or alpaca. Empty on the wire means yahoo at create time.
  string provider = 7;
  // Profile name for an alpaca price source. Not a credential.
  string profile = 8;
  // Server-filled login of the owning account. A client value is ignored.
  string owner_login = 9;

  // TickerResolution is a symbol whose bars create read under a later
  // ticker of the same ISIN, because the provider had none under the
  // symbol itself, such as FB read as META. It names no day: the provider
  // doesn't say when the ticker changed.
  message TickerResolution {
    // symbol is the ticker the backtest asked for.
    string symbol = 1;
    // read_as is the later ticker the bars were read and stored under.
    string read_as = 2;
  }
  // Server-filled by create, one per resolved symbol, ordered by symbol.
  // Empty when every symbol was read under its own ticker. A client value
  // is ignored.
  repeated TickerResolution ticker_resolutions = 10;
}
