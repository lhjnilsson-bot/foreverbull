syntax = "proto3";

package foreverbull.backtest.v1;

import "foreverbull/common.proto";
import "foreverbull/finance/v1/marketdata.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/backtest";

message Execution {
  string id = 1;
  string backtest = 2;
  string session = 3;
  foreverbull.common.Date start_date = 4;
  foreverbull.common.Date end_date = 5;
  optional Period result = 7;
  // Lines the user must read about how the run went although it finished,
  // such as members left out after their last price. Set when the run ends.
  repeated string notices = 8;
  // How the run's returns count dividends. Set when the result is stored.
  ReturnBasis return_basis = 9;
  // Foreign dividends the run booked at their gross amount, before any
  // withholding tax. Set when the result is stored.
  int32 foreign_dividends_gross = 10;
}

// ReturnBasis is how a run's returns count dividends.
enum ReturnBasis {
  // A run stored before dividends were counted.
  RETURN_BASIS_UNSPECIFIED = 0;
  // Bars are split-adjusted only and dividends are credited as cash on the
  // ex-date: the run has a total return and a price return.
  RETURN_BASIS_TOTAL = 1;
  // Bars are already dividend-adjusted (stooq) and no cash dividend is
  // booked: the one return is an adjusted-close return.
  RETURN_BASIS_ADJUSTED_CLOSE = 2;
}

// ExecutionFunction is one worker function stored when an execution is created.
// Parameter value is the supplied value, otherwise the default. Runs created
// before arguments were stored have an empty list. Broker port, namespace port,
// and database URL are not stored here.
message ExecutionFunction {
  message Parameter {
    string key = 1;
    string value = 2;
    string value_type = 3;
  }
  string name = 1;
  repeated Parameter parameters = 2;
}

message Period {
  foreverbull.common.Date date = 1;
  double PNL = 2;
  double returns = 3;
  double portfolio_value = 4;
  int32 longs_count = 5;
  int32 shorts_count = 6;
  double long_value = 7;
  double short_value = 8;
  double starting_exposure = 9;
  double ending_exposure = 10;
  double long_exposure = 11;
  double short_exposure = 12;
  double capital_used = 13;
  double gross_leverage = 14;
  double net_leverage = 15;
  double starting_value = 16;
  double ending_value = 17;
  double starting_cash = 18;
  double ending_cash = 19;
  double max_drawdown = 20;
  double max_leverage = 21;
  double excess_return = 22;
  double treasury_period_return = 23;
  // Total return from the run's start to this close: portfolio_value over
  // the starting value, minus 1. Dividends count from their ex-date.
  double algorithm_period_return = 24;
  optional double algo_volatility = 25;
  optional double sharpe = 26;
  optional double sortino = 27;
  // The benchmark's total return: close plus the dividend on its ex-date.
  optional double benchmark_period_return = 28;
  optional double benchmark_volatility = 29;
  optional double alpha = 30;
  optional double beta = 31;

  repeated foreverbull.finance.v1.Position positions = 32;

  // Price return from the run's start to this close: portfolio_value less
  // dividends_earned, over the starting value, minus 1.
  double price_return = 33;
  // Dividend cash credited from the run's start through this close, signed:
  // a short pays. Each dividend is credited at the open of its ex-date.
  double dividends_earned = 34;
  // The benchmark's price return: close to close, no dividends.
  optional double benchmark_price_return = 35;
}
