name: QA PR122 fbenv stop status
on:
  push:
    branches: [qa/pr122-kind]
permissions:
  contents: read
jobs:
  build-docker-foreverbull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Foreverbull
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          tags: lhjnilsson/foreverbull:on_commit
          outputs: type=docker,dest=/tmp/foreverbull.tar
      - name: Upload foreverbull
        uses: actions/upload-artifact@v4
        with:
          name: e2e-foreverbull
          path: /tmp/foreverbull.tar
          retention-days: 1

  build-docker-grafana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Grafana
        uses: docker/build-push-action@v6
        with:
          context: grafana
          file: ./grafana/Dockerfile
          # COPY --from=foreverbull is the repo root (go.mod and pkg/), not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          tags: lhjnilsson/fb-grafana:on_commit
          outputs: type=docker,dest=/tmp/fb_grafana.tar
      - name: Upload Grafana
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fb-grafana
          path: /tmp/fb_grafana.tar
          retention-days: 1

  build-python-packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: client/dist
          retention-days: 1

  build-docker-zipline:
    needs: [build-python-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-0.0.0-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" client/foreverbull-0.0.0-py3-none-any.whl
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Zipline
        uses: docker/build-push-action@v6
        with:
          context: client
          file: ./client/zipline/Dockerfile
          tags: lhjnilsson/zipline:on_commit
          build-args: |
            FB_WHEEL=foreverbull-0.0.0-py3-none-any.whl
          outputs: type=docker,dest=/tmp/zipline.tar
      - name: Upload zipline
        uses: actions/upload-artifact@v4
        with:
          name: e2e-zipline
          path: /tmp/zipline.tar
          retention-days: 1

  qa:
    needs: [build-docker-foreverbull, build-docker-grafana, build-docker-zipline, build-python-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VERSION: on_commit
      TERM: dumb
      COLUMNS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: e2e-foreverbull, path: /tmp/images}
      - uses: actions/download-artifact@v4
        with: {name: e2e-zipline, path: /tmp/images}
      - uses: actions/download-artifact@v4
        with: {name: e2e-fb-grafana, path: /tmp/images}
      - uses: actions/download-artifact@v4
        with: {name: e2e-dist, path: /tmp/pypi}
      - uses: azure/setup-helm@v4
        with: {version: v3.16.4}
      - uses: helm/kind-action@v1.14.0
        with: {version: v0.31.0, kubectl_version: v1.35.0, install_only: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install CLI and load images
        run: |
          set -euxo pipefail
          for f in /tmp/images/*.tar; do docker load -i "$f"; done
          pip install /tmp/pypi/*.whl
          which fbenv
      - name: fbenv create --start
        run: fbenv create --start
      - name: QA sequence
        run: |
          set -uo pipefail
          s() { echo "===== $1 @ $(date -u +%H:%M:%S.%N) ====="; fbenv status; kubectl -n foreverbull get deploy,pods -o wide; }
          s "BEFORE STOP"
          fbenv stop
          T0=$(date +%s)
          s "IMMEDIATELY AFTER STOP"
          for i in $(seq 1 45); do
            sleep 2
            out=$(fbenv status 2>&1)
            echo "===== POLL $i t=$(( $(date +%s)-T0 ))s ====="; echo "$out"; kubectl -n foreverbull get deploy,pods -o wide
            n=$(echo "$out" | grep -cE '│ *stopped *│'); echo "stopped rows: $n"; if [ "$n" -lt 6 ]; then :; else echo "ALL STOPPED at t=$(( $(date +%s)-T0 ))s (poll $i)"; break; fi
          done
          fbenv start &
          SP=$!
          sleep 1
          s "IMMEDIATELY AFTER START"
          wait $SP; echo "fbenv start exit=$?"
          s "AFTER START READY"
